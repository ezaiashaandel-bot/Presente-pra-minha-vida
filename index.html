<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#000000">

    <title>Para Yuyu ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         ABERTURA
    ====================================== -->

    <main id="intro">

        <!-- Partículas -->
        <div id="particles"></div>

        <!-- Luz/neblina -->
        <div class="atmosphere"></div>

        <!-- Texto principal -->
        <section id="loveMessage" class="hidden">

            <h1>feito pra você meu amor!!</h1>

            <p>ass: zaza</p>

        </section>

    </main>


    <!-- =====================================
         ARQUIVO DE INVESTIGAÇÃO
    ====================================== -->

    <main id="investigation" class="hidden">

        <div class="investigation-content">

            <div class="file-top">
                <span>ARQUIVO Nº 020</span>
                <span>CONFIDENCIAL</span>
            </div>

            <div class="line"></div>

            <div class="file-icon">
                🔎
            </div>

            <p class="classified">
                ACESSO RESTRITO
            </p>

            <h2>O caso de vocês</h2>

            <p class="description">
                Existem algumas coisas que somente alguém
                muito especial conseguiria descobrir...
            </p>

            <p class="description small">
                Algumas respostas estão escondidas.
                Você será capaz de encontrar todas?
            </p>

            <button id="startInvestigation">
                ACEITAR O CASO
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
              </html>
